name: Draft quality checks
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  translation-and-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: python scripts/validate_translations.py
      - run: python scripts/test_validation.py
      - run: dotnet run --project tests/Installer.Core.Tests
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build src/Installer/Installer.csproj -c Release
# Intentionally no publish, push or Release until complete translation/runtime/game testing.
