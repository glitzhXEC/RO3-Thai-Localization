[Service]
Endpoint=
FallbackEndpoint=
[General]
Language=th
FromLanguage=en
[Files]
Directory=Translation
OutputFile=Translation\{Lang}\Text\_AutoGeneratedTranslations.txt
[TextFrameworks]
EnableUGUI=True
EnableTextMesh=True
EnableNGUI=False
EnableTextMeshPro=True
EnableIMGUI=False
EnableUIElements=False
EnableFairyGUI=False
[Behaviour]
MaxCharactersPerTranslation=6000
MinDialogueChars=1
OverrideFont=Tahoma
FallbackFont=Tahoma
FallbackFontTextMeshPro=arialuni_sdf_u2022
EnableUIResizing=True
ForceUIResizing=False
EnableTextureTranslation=False
EnableTextureDumping=False
EnableTextureScanning=False
CopyToClipboard=False
OutputUntranslatableText=False
OutputTooLongText=False
GenerateStaticSubstitutionTranslations=False
GeneratePartialTranslations=False
EnableTranslationHelper=False
EnableSilentMode=True
CacheRegexLookups=False
CacheRegexPatternResults=False
EnableTextPathLogging=False
IgnoreWhitespaceInDialogue=False
TextGetterCompatibilityMode=True
HandleRichText=True
PersistRichTextMode=Final
[Http]
DisableCertificateValidation=False
[Debug]
EnableConsole=False
[TranslationAggregator]
EnabledTranslators=
